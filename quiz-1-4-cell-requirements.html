<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz &mdash; Chapter 1.4 Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b0f1a;--surface:#111827;--surface2:#1a2235;--border:#1f2d45;--border2:#2d3f5c;--text:#e4eaf4;--muted:#6b7fa0;--muted2:#3a4d6a;--accent:#fb923c;--correct:#34d399;--correct-bg:rgba(52,211,153,0.1);--correct-bd:rgba(52,211,153,0.35);--wrong:#f87171;--wrong-bg:rgba(248,113,113,0.1);--wrong-bd:rgba(248,113,113,0.35);}
  *{margin:0;padding:0;box-sizing:border-box;}body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;}
  .hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
  .hdr-left{display:flex;align-items:center;gap:0.75rem;}.hdr-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);}
  .hdr-title{font-weight:800;font-size:0.9rem;}.hdr-sub{font-size:0.75rem;color:var(--muted);margin-top:0.1rem;}
  .score-box{font-family:'Fira Code',monospace;font-size:0.8rem;color:var(--muted);}.score-box span{color:var(--accent);}
  .wrap{max-width:760px;margin:0 auto;padding:2rem 1.5rem 4rem;}
  .tabs{display:flex;gap:0.4rem;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:0.3rem;width:fit-content;margin-bottom:2rem;}
  .tab{padding:0.45em 1.1em;border-radius:7px;border:none;background:transparent;color:var(--muted);font-family:'Plus Jakarta Sans',sans-serif;font-size:0.82rem;font-weight:600;cursor:pointer;transition:all 0.15s;}
  .tab.on{background:var(--surface2);color:var(--text);border:1px solid var(--border2);}
  .prog-bar{height:4px;background:var(--surface2);border-radius:2px;margin-bottom:1.5rem;overflow:hidden;}
  .prog-fill{height:100%;background:var(--accent);border-radius:2px;transition:width 0.4s ease;}
  .prog-label{font-family:'Fira Code',monospace;font-size:0.7rem;color:var(--muted2);margin-bottom:0.5rem;}
  .fc-wrap{perspective:1200px;margin-bottom:1.5rem;}
  .fc{width:100%;min-height:220px;position:relative;transform-style:preserve-3d;transition:transform 0.55s cubic-bezier(.4,0,.2,1);cursor:pointer;}
  .fc.flipped{transform:rotateY(180deg);}
  .fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;border:1px solid var(--border2);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;background:var(--surface);}
  .fc-back{transform:rotateY(180deg);background:var(--surface2);}
  .fc-tag{font-family:'Fira Code',monospace;font-size:0.65rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--accent);margin-bottom:0.75rem;}
  .fc-q{font-size:1.05rem;font-weight:700;line-height:1.45;}
  .fc-a{font-size:0.92rem;color:var(--correct);line-height:1.6;}
  .fc-hint{font-size:0.75rem;color:var(--muted2);margin-top:0.5rem;font-style:italic;}
  .fc-nav{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:2rem;}
  .fc-btn{background:var(--surface);border:1px solid var(--border2);border-radius:10px;padding:0.6em 1.4em;color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;font-size:0.83rem;font-weight:600;cursor:pointer;transition:all 0.15s;}
  .fc-btn:hover{border-color:var(--accent);color:var(--accent);}
  .fc-count{font-family:'Fira Code',monospace;font-size:0.78rem;color:var(--muted);}
  .fc-knew{display:flex;gap:0.5rem;justify-content:center;margin-bottom:2.5rem;}
  .btn-knew{padding:0.5em 1.4em;border-radius:8px;border:1px solid;font-size:0.82rem;font-weight:600;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;transition:all 0.15s;}
  .btn-yes{background:var(--correct-bg);border-color:var(--correct-bd);color:var(--correct);}.btn-yes:hover{background:rgba(52,211,153,0.2);}
  .btn-no{background:var(--wrong-bg);border-color:var(--wrong-bd);color:var(--wrong);}.btn-no:hover{background:rgba(248,113,113,0.2);}
  .q-card{background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:1.75rem;margin-bottom:1.25rem;}
  .q-num{font-family:'Fira Code',monospace;font-size:0.68rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted2);margin-bottom:0.6rem;}
  .q-text{font-size:0.97rem;font-weight:600;line-height:1.55;margin-bottom:1.1rem;}
  .opts{display:flex;flex-direction:column;gap:0.5rem;}
  .opt{padding:0.75rem 1rem;border-radius:10px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;font-size:0.88rem;color:var(--muted);transition:all 0.15s;display:flex;align-items:flex-start;gap:0.75rem;line-height:1.5;}
  .opt:hover:not(.locked){border-color:var(--border2);color:var(--text);}
  .opt.chosen{border-color:rgba(139,92,246,0.5);background:rgba(139,92,246,0.1);color:var(--text);}
  .opt.correct{border-color:var(--correct-bd);background:var(--correct-bg);color:var(--correct);}
  .opt.wrong{border-color:var(--wrong-bd);background:var(--wrong-bg);color:var(--wrong);}
  .opt-letter{font-family:'Fira Code',monospace;font-size:0.75rem;font-weight:500;flex-shrink:0;margin-top:0.1rem;}
  .q-feedback{margin-top:1rem;padding:0.75rem 1rem;border-radius:10px;font-size:0.85rem;line-height:1.55;display:none;border:1px solid;}
  .q-feedback.show{display:block;}.q-feedback.ok{background:var(--correct-bg);border-color:var(--correct-bd);color:var(--correct);}.q-feedback.bad{background:var(--wrong-bg);border-color:var(--wrong-bd);color:var(--wrong);}
  .submit-row{display:flex;justify-content:flex-end;margin-top:1rem;}
  .btn-check{padding:0.55em 1.5em;border-radius:8px;border:none;background:var(--accent);color:#000;font-weight:700;font-size:0.85rem;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;}
  .results{display:none;background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:2rem;text-align:center;margin-top:2rem;}
  .results.show{display:block;}.res-score{font-size:3rem;font-weight:800;color:var(--accent);line-height:1;}
  .res-label{color:var(--muted);font-size:0.9rem;margin-top:0.4rem;margin-bottom:1.5rem;}
  .btn-reset{padding:0.6em 1.8em;border-radius:8px;border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-weight:600;font-size:0.85rem;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;}
  .btn-reset:hover{border-color:var(--accent);color:var(--accent);}
  .hidden{display:none;}
</style>
</head>
<body>
  <a href="index.html" style="position:fixed;bottom:1.5rem;right:1.5rem;z-index:999;text-decoration:none;display:flex;align-items:center;gap:0.5rem;background:#111827;border:1px solid #2d3f5c;border-radius:100px;padding:0.55em 1.2em;font-family:'Plus Jakarta Sans',sans-serif;font-size:0.82rem;font-weight:600;color:#6b7fa0;transition:all 0.18s;" onmouseover="this.style.borderColor='#34d399';this.style.color='#34d399';" onmouseout="this.style.borderColor='#2d3f5c';this.style.color='#6b7fa0';">← Home</a>
<header class="hdr">
  <div class="hdr-left"><div class="hdr-dot"></div><div><div class="hdr-title">Chapter 1.4 Quiz</div><div class="hdr-sub">Cell Requirements</div></div></div>
  <div class="score-box">MCQ Score: <span id="scoreDisp">0 / 0</span></div>
</header>
<div class="wrap">
  <div class="tabs">
    <button class="tab on" onclick="setMode('flash')">&#9889; Flashcards</button>
    <button class="tab" onclick="setMode('mcq')">&#128221; MCQ Quiz</button>
  </div>
  <div id="flashMode">
    <div class="prog-label" id="fcLabel">Card 1 of N</div>
    <div class="prog-bar"><div class="prog-fill" id="fcProg" style="width:5%"></div></div>
    <div class="fc-wrap"><div class="fc" id="fc" onclick="flipCard()">
      <div class="fc-face fc-front"><div class="fc-tag">Question &mdash; tap to reveal</div><div class="fc-q" id="fcQ"></div></div>
      <div class="fc-face fc-back"><div class="fc-tag">Answer</div><div class="fc-a" id="fcA"></div><div class="fc-hint" id="fcHint"></div></div>
    </div></div>
    <div class="fc-knew"><button class="btn-knew btn-no" onclick="markCard(false)">&#10007; Still learning</button><button class="btn-knew btn-yes" onclick="markCard(true)">&#10003; Got it</button></div>
    <div class="fc-nav"><button class="fc-btn" onclick="prevCard()">&larr; Prev</button><div class="fc-count" id="fcCount">0 known</div><button class="fc-btn" onclick="nextCard()">Next &rarr;</button></div>
  </div>
  <div id="mcqMode" class="hidden">
    <div id="mcqQuestions"></div>
    <div class="submit-row"><button class="btn-check" onclick="submitQuiz()">Submit Quiz</button></div>
    <div class="results" id="results"><div class="res-score" id="resScore"></div><div class="res-label" id="resLabel"></div><button class="btn-reset" onclick="resetQuiz()">Try Again</button></div>
  </div>
</div>
<script>
const cards = [{"q": "What is ATP and why is it called the energy currency of the cell?", "a": "ATP (adenosine triphosphate) is the cell's immediate, usable source of energy. It powers almost every energy-requiring reaction in cells.", "hint": ""}, {"q": "How is energy released from ATP?", "a": "The bond between the 2nd and 3rd phosphate groups is broken, releasing energy and forming ADP + a free phosphate group (Pi).", "hint": "ATP to ADP + Pi + Energy"}, {"q": "What is an autotroph? Give two types.", "a": "An organism that synthesises its own organic molecules from inorganic ones. Types: 1. Photosynthetic (use light). 2. Chemosynthetic (use chemical energy).", "hint": ""}, {"q": "What is a heterotroph?", "a": "An organism that cannot synthesise its own organic molecules and must obtain them by consuming other organisms.", "hint": "Consumer"}, {"q": "Write the word equation for photosynthesis.", "a": "Carbon dioxide + water \u2192 glucose + oxygen (requires light energy and chlorophyll)", "hint": ""}, {"q": "Write the chemical equation for photosynthesis.", "a": "6CO2 + 6H2O \u2192 C6H12O6 + 6O2", "hint": ""}, {"q": "Name three limiting factors of photosynthesis.", "a": "Light intensity, CO2 concentration, wavelength/colour of light.", "hint": ""}, {"q": "Which wavelengths of light does chlorophyll absorb most readily?", "a": "Violet/blue and red wavelengths. Green light is poorly absorbed \u2014 rate of photosynthesis decreases in green light.", "hint": ""}, {"q": "Write the word equation for aerobic respiration.", "a": "Glucose + oxygen \u2192 carbon dioxide + water (+36 ATP)", "hint": ""}, {"q": "Write the chemical equation for aerobic respiration.", "a": "C6H12O6 + 6O2 \u2192 6CO2 + 6H2O (+36 ATP)", "hint": ""}, {"q": "What are the three stages of aerobic respiration and where does each occur?", "a": "1. Glycolysis \u2014 cytoplasm (2 ATP). 2. Krebs cycle \u2014 mitochondria (2 ATP). 3. Electron transport chain \u2014 mitochondria (32 ATP).", "hint": ""}, {"q": "How much ATP does aerobic respiration produce and why so much?", "a": "36 ATP. Because oxygen allows for a complete breakdown of glucose.", "hint": ""}, {"q": "Write the word and chemical equations for ethanol fermentation.", "a": "Word: glucose \u2192 ethanol + carbon dioxide. Chemical: C6H12O6 \u2192 C2H5OH + 2CO2. Occurs in plants and yeast.", "hint": "Plants and yeast"}, {"q": "Write the word and chemical equations for lactic acid fermentation.", "a": "Word: glucose \u2192 lactic acid. Chemical: C6H12O6 \u2192 C3H6O3. Occurs in animals and some bacteria.", "hint": "Animals"}, {"q": "How much ATP does anaerobic respiration produce, and why less than aerobic?", "a": "Only 2 ATP \u2014 because there is no oxygen, leading to incomplete breakdown of glucose.", "hint": ""}, {"q": "What materials do photosynthetic autotrophs need to source?", "a": "CO2 from air (stomata), water from soil (roots/xylem), light from the sun, and at least 14 mineral nutrients (e.g. nitrogen, phosphorus) from soil.", "hint": ""}, {"q": "Why are nitrogen and phosphorus vital minerals for plants?", "a": "Nitrogen: needed for chlorophyll, DNA/RNA, amino acids, and ATP. Phosphorus: needed for DNA/RNA backbone, ATP triphosphate tail, and phospholipid membranes.", "hint": ""}, {"q": "Why must waste products be removed from cells?", "a": "Waste products (CO2, urea, lactic acid, ethanol) are toxic at high concentrations \u2014 they can denature proteins and cause cell death.", "hint": ""}, {"q": "How is CO2 removed from animal cells?", "a": "Excreted into blood \u2192 transported to lungs \u2192 diffuses into lungs \u2192 exhaled.", "hint": ""}, {"q": "What is urea, where is it produced, and how is it removed?", "a": "Urea is a waste product of protein metabolism, produced in liver cells. It is excreted into blood \u2192 kidneys filter it \u2192 excreted as urine.", "hint": ""}];
const mcqs = [{"q": "Which of the following correctly describes an autotroph?", "opts": ["Obtains energy by consuming other organisms", "Synthesises its own organic molecules from inorganic ones", "Requires oxygen for all energy production", "Can only live in sunlight"], "ans": 1, "exp": "Autotrophs synthesise their own organic energy-rich molecules (e.g. glucose) from simple inorganic molecules like CO2 and water."}, {"q": "How many ATP molecules does aerobic respiration produce?", "opts": ["2", "8", "36", "100"], "ans": 2, "exp": "Aerobic respiration produces 36 ATP: 2 from glycolysis + 2 from Krebs cycle + 32 from the electron transport chain."}, {"q": "Where does glycolysis occur?", "opts": ["Mitochondria", "Nucleus", "Cytoplasm", "Ribosome"], "ans": 2, "exp": "Glycolysis occurs in the cytoplasm and produces 2 ATP. It is the first stage of both aerobic and anaerobic respiration."}, {"q": "Ethanol fermentation occurs in which organisms?", "opts": ["Animals and bacteria", "Plants and yeast", "Fungi and animals", "Archaea only"], "ans": 1, "exp": "Ethanol fermentation occurs in plants and yeast. Lactic acid fermentation occurs in animals and some bacteria."}, {"q": "What is the word equation for lactic acid fermentation?", "opts": ["Glucose \u2192 ethanol + CO2", "Glucose + oxygen \u2192 CO2 + water", "Glucose \u2192 lactic acid", "Glucose \u2192 ATP + water"], "ans": 2, "exp": "Lactic acid fermentation: glucose \u2192 lactic acid. It occurs in animal cells during vigorous exercise when oxygen delivery is insufficient."}, {"q": "Which wavelengths does chlorophyll absorb MOST readily?", "opts": ["Green and yellow", "Red and violet/blue", "White and UV", "Orange only"], "ans": 1, "exp": "Chlorophyll absorbs violet/blue and red wavelengths most readily. Green light is poorly absorbed \u2014 photosynthesis rate drops."}, {"q": "Nitrogen is a key component of which molecules?", "opts": ["Phospholipid membranes only", "Chlorophyll, amino acids, nucleic acids, and ATP", "Cell walls only", "Fatty acids only"], "ans": 1, "exp": "Nitrogen is essential for chlorophyll, amino acids (proteins), nitrogenous bases (DNA/RNA), and adenosine in ATP."}, {"q": "Where does the Krebs cycle occur?", "opts": ["Cytoplasm", "Nucleus", "Mitochondria", "Cell membrane"], "ans": 2, "exp": "Both the Krebs cycle and electron transport chain occur in the mitochondria \u2014 they require oxygen."}, {"q": "Why must lactic acid be removed from muscle cells?", "opts": ["It provides energy", "It increases pH", "It lowers pH and can denature proteins at high concentrations", "It is needed for photosynthesis"], "ans": 2, "exp": "Lactic acid lowers pH inside cells, contributing to muscle fatigue. At high levels it denatures proteins and can cause cell death."}, {"q": "How do chemosynthetic autotrophs differ from photosynthetic autotrophs?", "opts": ["They use light energy", "They require chlorophyll", "They use chemical energy (e.g. from H2S) instead of light", "They cannot produce glucose"], "ans": 2, "exp": "Chemosynthetic autotrophs (e.g. sulfur bacteria at hydrothermal vents) use chemical energy from inorganic molecules like hydrogen sulfide instead of light."}];
let fcIdx=0,fcKnown=new Set(),answered=new Array(mcqs.length).fill(null),correct=0;
function setMode(m){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));event.target.classList.add('on');document.getElementById('flashMode').classList.toggle('hidden',m!=='flash');document.getElementById('mcqMode').classList.toggle('hidden',m!=='mcq');if(m==='mcq')buildMCQ();}
function showCard(){const c=cards[fcIdx];document.getElementById('fcQ').textContent=c.q;document.getElementById('fcA').textContent=c.a;document.getElementById('fcHint').textContent=c.hint?'Hint: '+c.hint:'';document.getElementById('fcLabel').textContent='Card '+(fcIdx+1)+' of '+cards.length;document.getElementById('fcProg').style.width=(((fcIdx+1)/cards.length)*100)+'%';document.getElementById('fcCount').textContent=fcKnown.size+' known';document.getElementById('fc').classList.remove('flipped');}
function flipCard(){document.getElementById('fc').classList.toggle('flipped');}
function nextCard(){if(fcIdx<cards.length-1){fcIdx++;showCard();}}
function prevCard(){if(fcIdx>0){fcIdx--;showCard();}}
function markCard(k){if(k)fcKnown.add(fcIdx);else fcKnown.delete(fcIdx);nextCard();}
function buildMCQ(){const c=document.getElementById('mcqQuestions');if(c.children.length>0)return;mcqs.forEach(function(q,qi){const d=document.createElement('div');d.className='q-card';const optsHtml=q.opts.map(function(o,oi){return '<div class="opt" id="opt'+qi+'_'+oi+'" onclick="choose('+qi+','+oi+')"><span class="opt-letter">'+['A','B','C','D'][oi]+'</span><span>'+o+'</span></div>';}).join('');d.innerHTML='<div class="q-num">Question '+(qi+1)+' of '+mcqs.length+'</div><div class="q-text">'+q.q+'</div><div class="opts" id="opts'+qi+'">'+optsHtml+'</div><div class="q-feedback" id="fb'+qi+'"></div>';c.appendChild(d);});}
function choose(qi,oi){if(answered[qi]!==null)return;document.querySelectorAll('#opts'+qi+' .opt').forEach(function(o){o.classList.remove('chosen');});document.getElementById('opt'+qi+'_'+oi).classList.add('chosen');answered[qi]=oi;}
function submitQuiz(){correct=0;mcqs.forEach(function(q,qi){const sel=answered[qi];if(sel===null)return;const opts=document.querySelectorAll('#opts'+qi+' .opt');opts.forEach(function(o){o.classList.add('locked');});opts[q.ans].classList.add('correct');const fb=document.getElementById('fb'+qi);if(sel===q.ans){correct++;fb.className='q-feedback show ok';fb.textContent='Correct! '+q.exp;}else{opts[sel].classList.add('wrong');fb.className='q-feedback show bad';fb.textContent='Incorrect. '+q.exp;}});document.getElementById('scoreDisp').textContent=correct+' / '+mcqs.length;const res=document.getElementById('results');res.classList.add('show');document.getElementById('resScore').textContent=correct+' / '+mcqs.length;const pct=Math.round((correct/mcqs.length)*100);document.getElementById('resLabel').textContent=pct>=80?'Excellent work!':pct>=60?'Good effort - review the ones you missed.':'Keep studying - you will get there!';res.scrollIntoView({behavior:'smooth'});}
function resetQuiz(){answered=new Array(mcqs.length).fill(null);correct=0;document.getElementById('mcqQuestions').innerHTML='';document.getElementById('results').classList.remove('show');document.getElementById('scoreDisp').textContent='0 / 0';buildMCQ();}
showCard();
</script>
</body>
</html>
