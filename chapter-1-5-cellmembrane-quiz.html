<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cell Membrane Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0f1e;
    --surface: #101828;
    --surface2: #162032;
    --border: #1e3a5f;
    --accent: #00e5ff;
    --accent2: #7c3aed;
    --accent3: #10b981;
    --warn: #f59e0b;
    --danger: #ef4444;
    --text: #e2e8f0;
    --muted: #64748b;
    --correct: #10b981;
    --wrong: #ef4444;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 20% 20%, rgba(0,229,255,0.04) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 80%, rgba(124,58,237,0.05) 0%, transparent 60%),
      radial-gradient(ellipse 50% 60% at 50% 50%, rgba(16,185,129,0.02) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .grid-bg {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 780px;
    margin: 0 auto;
    padding: 40px 24px 80px;
    position: relative;
    z-index: 1;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 48px;
    animation: fadeDown 0.6s ease both;
  }

  .chapter-tag {
    display: inline-block;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--accent);
    background: rgba(0,229,255,0.08);
    border: 1px solid rgba(0,229,255,0.2);
    padding: 4px 14px;
    border-radius: 20px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  h1 {
    font-family: 'Space Mono', monospace;
    font-size: clamp(22px, 4vw, 36px);
    font-weight: 700;
    line-height: 1.2;
    color: #fff;
    margin-bottom: 10px;
  }

  h1 span {
    color: var(--accent);
  }

  .subtitle {
    color: var(--muted);
    font-size: 14px;
    font-weight: 300;
  }

  /* Progress bar */
  .progress-wrap {
    margin-bottom: 36px;
    animation: fadeDown 0.6s 0.1s ease both;
  }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .progress-track {
    height: 3px;
    background: var(--surface2);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* Question card */
  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    margin-bottom: 20px;
    animation: fadeUp 0.5s ease both;
    position: relative;
    overflow: hidden;
  }

  .question-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2), transparent);
  }

  .q-number {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.1em;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .q-number::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .q-topic {
    display: inline-block;
    font-size: 10px;
    padding: 2px 10px;
    border-radius: 12px;
    background: rgba(124,58,237,0.15);
    color: #a78bfa;
    border: 1px solid rgba(124,58,237,0.3);
    margin-bottom: 12px;
    letter-spacing: 0.05em;
  }

  .q-text {
    font-size: 16px;
    font-weight: 500;
    line-height: 1.65;
    color: #f1f5f9;
    margin-bottom: 28px;
  }

  /* Options */
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 14px 18px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface2);
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
    overflow: hidden;
  }

  .option::before {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(0,229,255,0.04);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .option:hover:not(.disabled)::before { opacity: 1; }
  .option:hover:not(.disabled) {
    border-color: rgba(0,229,255,0.3);
    transform: translateX(3px);
  }

  .option.disabled { cursor: default; }

  .option.correct {
    border-color: var(--correct);
    background: rgba(16,185,129,0.08);
  }

  .option.wrong {
    border-color: var(--wrong);
    background: rgba(239,68,68,0.08);
  }

  .opt-key {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    width: 28px;
    height: 28px;
    border-radius: 6px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: var(--muted);
    transition: all 0.2s;
    margin-top: 1px;
  }

  .option.correct .opt-key {
    background: var(--correct);
    border-color: var(--correct);
    color: #fff;
  }

  .option.wrong .opt-key {
    background: var(--wrong);
    border-color: var(--wrong);
    color: #fff;
  }

  .opt-text {
    font-size: 14px;
    line-height: 1.5;
    color: var(--text);
    flex: 1;
  }

  /* Feedback */
  .feedback {
    margin-top: 18px;
    padding: 14px 18px;
    border-radius: 10px;
    font-size: 13.5px;
    line-height: 1.6;
    display: none;
    animation: fadeUp 0.3s ease both;
  }

  .feedback.show { display: block; }
  .feedback.correct-fb {
    background: rgba(16,185,129,0.08);
    border: 1px solid rgba(16,185,129,0.25);
    color: #6ee7b7;
  }
  .feedback.wrong-fb {
    background: rgba(239,68,68,0.06);
    border: 1px solid rgba(239,68,68,0.2);
    color: #fca5a5;
  }

  .feedback strong {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    display: block;
    margin-bottom: 4px;
  }

  /* Navigation */
  .nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-top: 8px;
  }

  .btn {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.05em;
    padding: 12px 24px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .btn-primary {
    background: var(--accent);
    color: #000;
  }
  .btn-primary:hover { background: #33ebff; transform: translateY(-1px); box-shadow: 0 4px 20px rgba(0,229,255,0.3); }
  .btn-primary:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; transform: none; box-shadow: none; }

  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--muted); }

  /* Score screen */
  .score-screen {
    display: none;
    text-align: center;
    animation: fadeUp 0.6s ease both;
  }

  .score-screen.show { display: block; }

  .score-circle {
    width: 160px;
    height: 160px;
    margin: 0 auto 32px;
    position: relative;
  }

  .score-circle svg {
    transform: rotate(-90deg);
  }

  .score-circle circle {
    fill: none;
    stroke-width: 8;
    stroke-linecap: round;
  }

  .score-circle .track { stroke: var(--surface2); }
  .score-circle .fill { stroke: var(--accent); transition: stroke-dashoffset 1s ease; }

  .score-num {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .score-big {
    font-family: 'Space Mono', monospace;
    font-size: 38px;
    font-weight: 700;
    color: #fff;
    line-height: 1;
  }

  .score-label {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
    letter-spacing: 0.08em;
  }

  .score-grade {
    font-family: 'Space Mono', monospace;
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .score-msg {
    color: var(--muted);
    font-size: 15px;
    margin-bottom: 40px;
    line-height: 1.6;
    max-width: 420px;
    margin-left: auto;
    margin-right: auto;
  }

  .score-breakdown {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 36px;
  }

  .breakdown-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 12px;
  }

  .breakdown-val {
    font-family: 'Space Mono', monospace;
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .breakdown-lbl {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  /* Animations */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Floating cell decorations */
  .deco {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
    opacity: 0.12;
    filter: blur(1px);
  }
  .deco-1 {
    width: 300px; height: 300px;
    border: 1px solid var(--accent);
    top: -80px; right: -80px;
    animation: spin 40s linear infinite;
  }
  .deco-2 {
    width: 200px; height: 200px;
    border: 1px solid var(--accent2);
    bottom: 100px; left: -60px;
    animation: spin 30s linear infinite reverse;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Question indicator dots */
  .q-dots {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }

  .q-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--surface2);
    border: 1px solid var(--border);
    transition: all 0.3s;
  }
  .q-dot.active { background: var(--accent); border-color: var(--accent); transform: scale(1.3); }
  .q-dot.answered-c { background: var(--correct); border-color: var(--correct); }
  .q-dot.answered-w { background: var(--wrong); border-color: var(--wrong); }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="deco deco-1"></div>
<div class="deco deco-2"></div>

<div class="container">
  <div class="header">
    <div class="chapter-tag">Chapter 1.5 · Biology</div>
    <h1>The Cell <span>Membrane</span></h1>
    <p class="subtitle">Structure · Transport · Osmosis · Surface Area</p>
  </div>

  <!-- Quiz area -->
  <div id="quizArea">
    <div class="progress-wrap">
      <div class="progress-meta">
        <span id="progressText">Question 1 of 20</span>
        <span id="scoreText">Score: 0</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill" style="width:5%"></div>
      </div>
    </div>

    <div class="q-dots" id="qDots"></div>

    <div class="question-card" id="questionCard">
      <div class="q-number" id="qNum">Q 01</div>
      <div class="q-topic" id="qTopic">Topic</div>
      <div class="q-text" id="qText">Question text</div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
    </div>

    <div class="nav">
      <button class="btn btn-ghost" id="btnPrev" onclick="prevQ()" style="visibility:hidden">← PREV</button>
      <button class="btn btn-primary" id="btnNext" onclick="nextQ()" disabled>NEXT →</button>
    </div>
  </div>

  <!-- Score screen -->
  <div class="score-screen" id="scoreScreen">
    <div class="score-circle">
      <svg width="160" height="160" viewBox="0 0 160 160">
        <circle class="track" cx="80" cy="80" r="68"/>
        <circle class="fill" id="scoreArc" cx="80" cy="80" r="68"
          stroke-dasharray="427"
          stroke-dashoffset="427"/>
      </svg>
      <div class="score-num">
        <div class="score-big" id="scorePct">0%</div>
        <div class="score-label">SCORE</div>
      </div>
    </div>

    <div class="score-grade" id="scoreGrade"></div>
    <p class="score-msg" id="scoreMsg"></p>

    <div class="score-breakdown">
      <div class="breakdown-item">
        <div class="breakdown-val" style="color:var(--correct)" id="bdCorrect">0</div>
        <div class="breakdown-lbl">Correct</div>
      </div>
      <div class="breakdown-item">
        <div class="breakdown-val" style="color:var(--wrong)" id="bdWrong">0</div>
        <div class="breakdown-lbl">Incorrect</div>
      </div>
      <div class="breakdown-item">
        <div class="breakdown-val" style="color:var(--accent)" id="bdTotal">20</div>
        <div class="breakdown-lbl">Total</div>
      </div>
    </div>

    <button class="btn btn-primary" onclick="restartQuiz()">RESTART QUIZ</button>
  </div>
</div>

<script>
const questions = [
  {
    topic: "Cell Membrane Structure",
    text: "Which of the following molecules is NOT part of the cell membrane structure?",
    options: ["Carbohydrates", "Cellulose", "Lipids", "Protein"],
    answer: 1,
    feedback: "Cellulose is a structural polysaccharide found in plant cell walls, not the cell membrane. The cell membrane is made of phospholipids, proteins, carbohydrates (as glycoproteins/glycolipids), and cholesterol."
  },
  {
    topic: "Cholesterol",
    text: "Which statement about cholesterol in the cell membrane is correct?",
    options: [
      "It contributes to the fluid nature of the phospholipid membrane.",
      "It is not a component of the cell membrane.",
      "It is hydrophilic and located in aqueous parts of cells.",
      "It is embedded in the phospholipid membrane and is responsible for its mosaic nature."
    ],
    answer: 0,
    feedback: "Cholesterol is embedded within the phospholipid bilayer and helps regulate membrane fluidity. It is not responsible for the 'mosaic' nature — that refers to the variety of proteins."
  },
  {
    topic: "Phospholipid Bilayer",
    text: "Why do the fatty acid tails of phospholipids project inwards, away from the aqueous environments?",
    options: [
      "They are hydrophilic and attract water molecules.",
      "They are hydrophobic and do not interact well with water.",
      "They form covalent bonds with membrane proteins.",
      "They carry a positive charge that repels the cytoplasm."
    ],
    answer: 1,
    feedback: "The fatty acid tails are hydrophobic (water-fearing) and non-polar. They orient away from the aqueous intracellular and extracellular environments, projecting inward toward each other."
  },
  {
    topic: "Membrane Proteins",
    text: "What is the difference between integral and peripheral proteins in the cell membrane?",
    options: [
      "Integral proteins are only found on the outside surface; peripheral proteins span the full width.",
      "Integral proteins are integrated within the phospholipid bilayer; peripheral proteins attach to the bilayer surfaces.",
      "Integral proteins only function as enzymes; peripheral proteins only function as receptors.",
      "There is no functional difference — they perform the same roles."
    ],
    answer: 1,
    feedback: "Integral proteins are embedded within (integrated into) the phospholipid bilayer, sometimes spanning its full width. Peripheral proteins attach to the internal or external surfaces of the bilayer."
  },
  {
    topic: "Fluid Mosaic Model",
    text: "In the fluid mosaic model of the cell membrane, what does 'fluid' refer to?",
    options: [
      "The water-soluble nature of the phosphate heads.",
      "The ability of lipids and proteins to continuously move within the membrane.",
      "The flow of water through aquaporin proteins.",
      "The liquid-like nature of the cytoplasm inside the cell."
    ],
    answer: 1,
    feedback: "'Fluid' refers to the ability of both lipids and proteins to move laterally within the membrane. This movement is critical for membrane permeability. The 'mosaic' refers to the varied proteins embedded in the bilayer."
  },
  {
    topic: "Selective Permeability",
    text: "Which of the following best describes why the cell membrane is called 'semi-permeable'?",
    options: [
      "It allows all molecules to pass through at the same rate.",
      "It only allows water to pass through.",
      "It allows some molecules to pass through but not all, based on size, charge and solubility.",
      "It prevents all molecules from entering the cell."
    ],
    answer: 2,
    feedback: "The cell membrane is semi-permeable because it selectively allows molecules to pass based on factors such as their size, charge, and water solubility. Transport proteins help larger or hydrophilic molecules cross."
  },
  {
    topic: "Membrane Permeability",
    text: "Which of the following molecules would have the HIGHEST permeability across the cell membrane without transport proteins?",
    options: ["Glucose", "Sodium ions", "Carbon dioxide (CO₂)", "Amino acids"],
    answer: 2,
    feedback: "CO₂ is a small, uncharged, non-polar gas molecule that can diffuse freely across the phospholipid bilayer. Glucose, sodium ions, and amino acids require transport proteins to cross."
  },
  {
    topic: "Simple Diffusion",
    text: "What is simple diffusion?",
    options: [
      "The movement of water from low to high solute concentration.",
      "Movement of molecules from high to low concentration, requiring energy.",
      "Movement of molecules from high to low concentration without energy expenditure.",
      "Transport of molecules against the concentration gradient using carrier proteins."
    ],
    answer: 2,
    feedback: "Simple diffusion is the passive movement of molecules from a region of high concentration to low concentration. No energy is required. Small uncharged molecules like O₂ and CO₂ cross membranes this way."
  },
  {
    topic: "Facilitated Diffusion",
    text: "Which statement correctly describes facilitated diffusion?",
    options: [
      "It moves molecules against the concentration gradient using ATP.",
      "It moves molecules down the concentration gradient using transport proteins, requiring no energy.",
      "It only transports water molecules through aquaporins.",
      "It requires energy because transport proteins are used."
    ],
    answer: 1,
    feedback: "Facilitated diffusion uses transport proteins to help hydrophilic molecules and ions cross the membrane. Movement is still down the concentration gradient, so no energy is required — it remains a passive process."
  },
  {
    topic: "Osmosis",
    text: "Osmosis is the movement of water from:",
    options: [
      "Low water concentration (high solute) to high water concentration (low solute).",
      "High water concentration (low solute) to low water concentration (high solute).",
      "High solute concentration to low solute concentration.",
      "High concentration to low concentration of any molecule."
    ],
    answer: 1,
    feedback: "Osmosis is the diffusion of water from an area of high water concentration (low solute) to low water concentration (high solute) through a semi-permeable membrane. Solutes bind water, reducing 'free' water molecules."
  },
  {
    topic: "Osmosis",
    text: "A cell is placed in a hypertonic solution. What will happen?",
    options: [
      "Water moves into the cell; it swells.",
      "No net movement of water occurs.",
      "Water moves out of the cell; it shrivels.",
      "Solute moves into the cell to equalise concentrations."
    ],
    answer: 2,
    feedback: "In a hypertonic solution, the external solute concentration is higher than inside the cell. Water moves out by osmosis, causing the cell to shrivel (crenation in animal cells, plasmolysis in plant cells)."
  },
  {
    topic: "Osmosis in Cells",
    text: "What happens to a plant cell placed in a hypotonic solution?",
    options: [
      "It bursts, as there is no cell wall to provide support.",
      "It becomes turgid and firm; the cell wall prevents bursting.",
      "It shrivels due to water leaving the cell.",
      "No change occurs because plant cells are unaffected by osmosis."
    ],
    answer: 1,
    feedback: "In a hypotonic solution, water enters the plant cell by osmosis, causing it to become turgid. Unlike animal cells, the rigid cell wall prevents the cell from bursting by resisting the osmotic pressure."
  },
  {
    topic: "Osmosis in Cells",
    text: "What is plasmolysis?",
    options: [
      "The bursting of an animal cell in a hypotonic solution.",
      "The swelling of a plant cell in a hypotonic solution.",
      "The pulling away of the cell membrane from the cell wall when a plant cell loses water.",
      "The movement of water through aquaporin proteins."
    ],
    answer: 2,
    feedback: "Plasmolysis occurs in plant cells exposed to hypertonic conditions. Water moves out by osmosis, causing the cell membrane to pull away from the cell wall as the cytoplasm shrinks."
  },
  {
    topic: "Active Transport",
    text: "How does active transport differ from passive transport?",
    options: [
      "Active transport moves molecules down the concentration gradient; passive moves them against it.",
      "Active transport requires energy and moves molecules against the concentration gradient; passive does not require energy and moves with the gradient.",
      "Active transport uses no proteins; passive transport uses carrier proteins.",
      "Active and passive transport are the same process with different names."
    ],
    answer: 1,
    feedback: "Active transport uses energy (ATP) to move molecules against the concentration gradient (low to high). Passive transport (diffusion, osmosis) requires no energy and moves molecules with the gradient (high to low)."
  },
  {
    topic: "Active Transport",
    text: "Glucose absorption in the small intestine uses active transport when:",
    options: [
      "Glucose concentration in the intestine is higher than in the epithelial cells.",
      "Glucose concentration in the intestine is lower than in the epithelial cells.",
      "Water concentration is too high in the intestine.",
      "The cell membrane lacks transport proteins."
    ],
    answer: 1,
    feedback: "When glucose concentration in the small intestine drops below that of the epithelial cells, facilitated diffusion is no longer possible. Active transport is then used to absorb glucose against the concentration gradient."
  },
  {
    topic: "Endocytosis & Exocytosis",
    text: "Which process involves the cell membrane folding inward to engulf large molecules, forming a vesicle inside the cell?",
    options: ["Exocytosis", "Facilitated diffusion", "Endocytosis", "Osmosis"],
    answer: 2,
    feedback: "Endocytosis is the process where the cell membrane folds inward around large molecules, pinching off to form a vesicle inside the cell. Exocytosis is the reverse — vesicles fuse with the membrane to release contents."
  },
  {
    topic: "Transport Comparison",
    text: "Which row correctly compares active and passive transport?",
    options: [
      "Both require ATP and move molecules against the gradient.",
      "Active: against gradient, requires ATP. Passive: with gradient, no ATP needed.",
      "Active: with gradient, no ATP. Passive: against gradient, requires ATP.",
      "Both move molecules down the concentration gradient."
    ],
    answer: 1,
    feedback: "Active transport moves molecules against the concentration gradient and requires energy (ATP). Passive transport (diffusion, facilitated diffusion, osmosis) moves molecules with the gradient and requires no energy."
  },
  {
    topic: "Surface Area to Volume",
    text: "Why must cells remain microscopic in size to survive?",
    options: [
      "Larger cells cannot produce enough ATP to function.",
      "Larger cells have a higher SA:V ratio, which is too efficient for the cell.",
      "As cells grow, their volume increases proportionally more than their surface area, reducing the SA:V ratio and exchange efficiency.",
      "Microscopic cells divide more slowly, which is beneficial for survival."
    ],
    answer: 2,
    feedback: "As a cell grows, its volume increases faster than its surface area, decreasing the SA:V ratio. A low SA:V ratio means insufficient membrane surface for efficient exchange of materials with the environment."
  },
  {
    topic: "Surface Area to Volume",
    text: "If a spherical cell's radius triples (from 1× to 3×), how do its surface area and volume change?",
    options: [
      "Surface area increases 9×; volume increases 27×.",
      "Both increase by 9×.",
      "Surface area increases 27×; volume increases 9×.",
      "Both increase by 3×."
    ],
    answer: 0,
    feedback: "Surface area scales with the square of radius (3² = 9×), while volume scales with the cube (3³ = 27×). This means SA:V decreases as the cell grows larger, reducing exchange efficiency."
  },
  {
    topic: "Cell Membrane Functions",
    text: "Which component of the cell membrane is primarily responsible for cell recognition by the immune system?",
    options: [
      "Cholesterol embedded in the bilayer.",
      "Glycoproteins and glycolipids acting as cell identity markers.",
      "Peripheral proteins on the internal surface.",
      "The phospholipid bilayer itself."
    ],
    answer: 1,
    feedback: "Glycoproteins and glycolipids on the cell surface act as cell identity markers. The immune system uses these to distinguish between the body's own 'self' cells and foreign 'non-self' cells such as bacteria."
  }
];

let current = 0;
let score = 0;
let answered = new Array(questions.length).fill(null); // null, 'correct', or 'wrong'

function initDots() {
  const container = document.getElementById('qDots');
  container.innerHTML = '';
  questions.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = 'q-dot' + (i === 0 ? ' active' : '');
    dot.id = `dot-${i}`;
    container.appendChild(dot);
  });
}

function renderQuestion() {
  const q = questions[current];
  document.getElementById('qNum').textContent = `Q ${String(current + 1).padStart(2, '0')}`;
  document.getElementById('qTopic').textContent = q.topic;
  document.getElementById('qText').textContent = q.text;
  document.getElementById('progressText').textContent = `Question ${current + 1} of ${questions.length}`;
  document.getElementById('scoreText').textContent = `Score: ${score}`;
  document.getElementById('progressFill').style.width = `${((current + 1) / questions.length) * 100}%`;

  // Dots
  document.querySelectorAll('.q-dot').forEach((d, i) => {
    d.className = 'q-dot';
    if (i === current) d.classList.add('active');
    else if (answered[i] === 'correct') d.classList.add('answered-c');
    else if (answered[i] === 'wrong') d.classList.add('answered-w');
  });

  // Options
  const optContainer = document.getElementById('options');
  optContainer.innerHTML = '';
  q.options.forEach((opt, i) => {
    const keys = ['J', 'K', 'L', 'M'];
    const el = document.createElement('div');
    el.className = 'option';
    el.id = `opt-${i}`;
    el.innerHTML = `<div class="opt-key">${keys[i]}</div><div class="opt-text">${opt}</div>`;
    el.onclick = () => selectOption(i);
    optContainer.appendChild(el);
  });

  // Feedback
  const fb = document.getElementById('feedback');
  fb.className = 'feedback';
  fb.innerHTML = '';

  // Restore state if already answered
  if (answered[current]) {
    const wasCorrect = answered[current] === 'correct';
    const correctIdx = q.answer;
    // Mark correct
    document.getElementById(`opt-${correctIdx}`).classList.add('correct');
    if (!wasCorrect) {
      // We don't store which was selected, highlight correct and show feedback
    }
    document.querySelectorAll('.option').forEach(o => o.classList.add('disabled'));
    showFeedback(wasCorrect, q.feedback);
    document.getElementById('btnNext').disabled = false;
  }

  // Prev button
  const btnPrev = document.getElementById('btnPrev');
  btnPrev.style.visibility = current > 0 ? 'visible' : 'hidden';

  // Next button text
  const btnNext = document.getElementById('btnNext');
  btnNext.textContent = current === questions.length - 1 ? 'FINISH →' : 'NEXT →';
  if (!answered[current]) btnNext.disabled = true;

  // Animate card
  const card = document.getElementById('questionCard');
  card.style.animation = 'none';
  card.offsetHeight; // reflow
  card.style.animation = 'fadeUp 0.4s ease both';
}

function selectOption(idx) {
  const q = questions[current];
  if (answered[current]) return;

  const isCorrect = idx === q.answer;
  answered[current] = isCorrect ? 'correct' : 'wrong';

  if (isCorrect) score++;

  // Style options
  document.querySelectorAll('.option').forEach((o, i) => {
    o.classList.add('disabled');
    if (i === q.answer) o.classList.add('correct');
    else if (i === idx && !isCorrect) o.classList.add('wrong');
  });

  showFeedback(isCorrect, q.feedback);
  document.getElementById('scoreText').textContent = `Score: ${score}`;
  document.getElementById('btnNext').disabled = false;

  // Update dot
  const dot = document.getElementById(`dot-${current}`);
  dot.classList.remove('active');
  dot.classList.add(isCorrect ? 'answered-c' : 'answered-w');
}

function showFeedback(correct, text) {
  const fb = document.getElementById('feedback');
  fb.className = `feedback show ${correct ? 'correct-fb' : 'wrong-fb'}`;
  fb.innerHTML = `<strong>${correct ? '✓ CORRECT' : '✗ INCORRECT'}</strong>${text}`;
}

function nextQ() {
  if (current < questions.length - 1) {
    current++;
    renderQuestion();
  } else {
    showScore();
  }
}

function prevQ() {
  if (current > 0) {
    current--;
    renderQuestion();
  }
}

function showScore() {
  document.getElementById('quizArea').style.display = 'none';
  const ss = document.getElementById('scoreScreen');
  ss.classList.add('show');

  const pct = Math.round((score / questions.length) * 100);
  const wrong = questions.length - score;

  document.getElementById('bdCorrect').textContent = score;
  document.getElementById('bdWrong').textContent = wrong;
  document.getElementById('bdTotal').textContent = questions.length;
  document.getElementById('scorePct').textContent = `${pct}%`;

  let grade, msg, color;
  if (pct >= 90) { grade = 'EXCELLENT'; msg = 'Outstanding work! You have a strong understanding of cell membrane structure and transport mechanisms.'; color = 'var(--correct)'; }
  else if (pct >= 75) { grade = 'PROFICIENT'; msg = 'Great effort! You understand most concepts well. Review the questions you missed for a complete picture.'; color = 'var(--accent)'; }
  else if (pct >= 60) { grade = 'DEVELOPING'; msg = 'Good start. Focus on reviewing passive vs. active transport and osmosis concepts to strengthen your understanding.'; color = 'var(--warn)'; }
  else { grade = 'NEEDS REVIEW'; msg = 'This topic needs more attention. Revisit the cell membrane structure, transport types, and osmosis sections of your notes.'; color = 'var(--danger)'; }

  const gradeEl = document.getElementById('scoreGrade');
  gradeEl.textContent = grade;
  gradeEl.style.color = color;
  document.getElementById('scoreMsg').textContent = msg;

  // Animate arc
  setTimeout(() => {
    const circumference = 427;
    const offset = circumference - (pct / 100) * circumference;
    document.getElementById('scoreArc').style.strokeDashoffset = offset;
    document.getElementById('scoreArc').style.stroke = color;
  }, 100);
}

function restartQuiz() {
  current = 0;
  score = 0;
  answered = new Array(questions.length).fill(null);
  document.getElementById('scoreScreen').classList.remove('show');
  document.getElementById('quizArea').style.display = 'block';
  initDots();
  renderQuestion();
}

// Init
initDots();
renderQuestion();
</script>
</body>
